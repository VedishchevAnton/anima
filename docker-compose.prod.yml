services:
  web:
    build: .
    environment:
      - DEBUG=false
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      - YANDEX_MAP_API_KEY=${YANDEX_MAP_API_KEY}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      # Адрес бота MAX; без BOT_DOMAIN в .env — bot.localhost, чтобы Caddy запускался и без бота.
      - BOT_DOMAIN=${BOT_DOMAIN:-bot.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - proxy
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

networks:
  # Общая сеть с ботом MAX (проект max-bot). Создаётся один раз: docker network create proxy
  proxy:
    external: true
